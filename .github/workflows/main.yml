
name: Model Training CICD

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Fix Node.js compatibility
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Step 3: Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # Step 4: Install CML
      - name: Setup CML
        uses: iterative/setup-cml@v1

      # Step 5: Install Python libraries
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas matplotlib seaborn scikit-learn

      # Step 6: Train ML models
      - name: Train Model
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python code.py

      # Step 7: Generate ML report
      - name: Generate Report
        run: |
          echo "# Random Forest and Logistic Regression Scores" > report.md

          cat scores.txt >> report.md

          echo "" >> report.md
          echo "## Confusion Matrix" >> report.md
          echo "![Confusion Matrix](./ConfusionMatrix.png)" >> report.md

          echo "" >> report.md
          echo "## Feature Importance" >> report.md
          echo "![Feature Importance](./FeatureImportance.png)" >> report.md

          cat report.md >> $GITHUB_STEP_SUMMARY

      # Step 8: Publish CML report on Pull Request
      - name: Create CML Comment
        if: github.event_name == 'pull_request'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cml comment create report.md



