
name: Model Training CICD

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches:
      - main

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout GitHub repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Step 3: Setup CML
      - name: Setup CML
        uses: iterative/setup-cml@v1

      # Step 4: Install libraries (No requirements.txt)
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas matplotlib seaborn scikit-learn

      # Step 5: Train ML model
      - name: Train Model
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python code.py

          echo "## RF and LR Model Scores" > report.md
          cat scores.txt >> report.md

          echo "## Confusion Matrix and Feature Importance" >> report.md
          echo "![Confusion Matrix](./ConfusionMatrix.png)" >> report.md
          echo "![Feature Importance](./FeatureImportance.png)" >> report.md

          # Create CML report
          cml comment create report.md



